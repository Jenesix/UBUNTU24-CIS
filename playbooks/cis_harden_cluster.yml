---
# =============================================================================
# CIS Ubuntu 24 Hardening — UAT Non-Prod Cluster
# =============================================================================
# Usage:
#   ansible-playbook playbooks/cis_harden_cluster.yml -i inventory/cluster.ini
#
# Dry-run:
#   ansible-playbook playbooks/cis_harden_cluster.yml -i inventory/cluster.ini --check
#
# เฉพาะกลุ่มเดียว:
#   ansible-playbook playbooks/cis_harden_cluster.yml -i inventory/cluster.ini --limit app_servers
# =============================================================================

# -----------------------------------------------------------------------------
# PLAY 1: HAProxy Load Balancers
# -----------------------------------------------------------------------------
- name: CIS Harden HAProxy Load Balancer Nodes
  hosts: haproxy
  become: true
  gather_facts: true

  pre_tasks:
    - name: "[Pre] Verify HAProxy is installed"
      ansible.builtin.package:
        name: haproxy
        state: present
      tags: always

  roles:
    - role: "{{ playbook_dir | dirname }}"
      tags: cis

  post_tasks:
    - name: "[Post] Open inbound ports for HAProxy"
      community.general.ufw:
        rule: allow
        direction: in
        proto: "{{ item.proto }}"
        to_port: "{{ item.port | string }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: "22",   proto: tcp, comment: "SSH" }
        - { port: "80",   proto: tcp, comment: "HAProxy HTTP frontend" }
        - { port: "443",  proto: tcp, comment: "HAProxy HTTPS / Rancher UI" }
        - { port: "6443", proto: tcp, comment: "HAProxy -> RKE2 API Server" }
        - { port: "9345", proto: tcp, comment: "HAProxy -> RKE2 registration" }
        - { port: "8404", proto: tcp, comment: "HAProxy stats page" }
      notify: Reload ufw
      tags: firewall

    - name: "[Post] Set sysctl for HAProxy"
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-haproxy.conf
        reload: true
      loop:
        - { name: net.ipv4.ip_forward,             value: "1" }
        - { name: net.ipv4.conf.all.rp_filter,     value: "0" }
        - { name: net.ipv4.conf.default.rp_filter, value: "0" }
      tags: sysctl

    - name: "[Post] Ensure HAProxy service is running"
      ansible.builtin.systemd:
        name: haproxy
        state: started
        enabled: true
      tags: service

  handlers:
    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: true

# -----------------------------------------------------------------------------
# PLAY 2: RKE2 Control Plane Nodes
# -----------------------------------------------------------------------------
- name: CIS Harden RKE2 Control Plane Nodes
  hosts: rke2_control_plane
  become: true
  gather_facts: true

  roles:
    - role: "{{ playbook_dir | dirname }}"
      tags: cis

  post_tasks:
    - name: "[Post] Open inbound ports for RKE2 Control Plane"
      community.general.ufw:
        rule: allow
        direction: in
        proto: "{{ item.proto }}"
        to_port: "{{ item.port | string }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: "22",          proto: tcp, comment: "SSH" }
        - { port: "6443",        proto: tcp, comment: "RKE2 API Server" }
        - { port: "9345",        proto: tcp, comment: "RKE2 registration" }
        - { port: "2379",        proto: tcp, comment: "etcd client" }
        - { port: "2380",        proto: tcp, comment: "etcd peer" }
        - { port: "10250",       proto: tcp, comment: "Kubelet" }
        - { port: "10257",       proto: tcp, comment: "kube-controller-manager" }
        - { port: "10259",       proto: tcp, comment: "kube-scheduler" }
        - { port: "4240",        proto: tcp, comment: "Cilium health check" }
        - { port: "8472",        proto: udp, comment: "Cilium VXLAN overlay" }
        - { port: "30000:32767", proto: tcp, comment: "NodePort Services" }
      notify: Reload ufw
      tags: firewall

    - name: "[Post] Set sysctl for RKE2 Control Plane"
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-rke2.conf
        reload: true
      loop:
        - { name: net.ipv4.ip_forward,                 value: "1" }
        - { name: net.ipv6.conf.all.forwarding,        value: "1" }
        - { name: net.ipv4.conf.all.rp_filter,         value: "0" }
        - { name: net.ipv4.conf.default.rp_filter,     value: "0" }
        - { name: net.bridge.bridge-nf-call-iptables,  value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: fs.inotify.max_user_instances,       value: "8192" }
        - { name: fs.inotify.max_user_watches,         value: "524288" }
      tags: sysctl

    - name: "[Post] Load kernel modules for containerd"
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay
      tags: kernel

    - name: "[Post] Persist kernel modules on boot"
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/rke2.conf
        line: "{{ item }}"
        create: true
        mode: '0644'
      loop:
        - br_netfilter
        - overlay
      tags: kernel

  handlers:
    - name: Reload ufw
      ansible.builtin.command: ufw reload
      changed_when: true

