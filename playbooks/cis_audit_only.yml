---
# =============================================================================
# CIS Audit Only — ดู baseline ก่อน harden (ไม่แก้ไขระบบ)
# =============================================================================
# Usage:
#   ansible-playbook playbooks/cis_audit_only.yml -i inventory/cluster.ini --ask-become-pass
#
# เฉพาะ haproxy:
#   ansible-playbook playbooks/cis_audit_only.yml -i inventory/cluster.ini --limit haproxy --ask-become-pass
#
# เฉพาะ rke2:
#   ansible-playbook playbooks/cis_audit_only.yml -i inventory/cluster.ini --limit rke2_cluster --ask-become-pass
# =============================================================================

- name: CIS Audit Only — Ubuntu 24.04
  hosts: haproxy,rke2_cluster
  become: true
  gather_facts: true

  vars:
    audit_only: true
    run_audit: true
    setup_audit: true
    fetch_audit_output: true
    audit_output_destination: "{{ playbook_dir | dirname }}/audit_summaries/"

  roles:
    - role: "{{ playbook_dir | dirname }}"
