---
# CIS Hardening Overrides for RKE2 Control Plane Nodes (CNI: Cilium)

# ============================================================
# CRITICAL: Kernel Module
# overlayfs — containerd ใช้เป็น storage driver หลัก ห้าม disable
# ============================================================
ubtu24cis_rule_1_1_1_6: false

# ============================================================
# CRITICAL: Network / IP Forwarding
# ปิด CIS rule แล้ว set sysctl เองใน post_tasks ของ playbook
# ============================================================
ubtu24cis_rule_3_3_1: false   # IP forwarding — pod คุยข้าม node
ubtu24cis_rule_3_3_7: false   # rp_filter — Cilium eBPF route ข้าม interface

# ============================================================
# Firewall (UFW)
# ============================================================
ubtu24cis_firewall_package: "none"

ubtu24cis_ufw_allow_out_ports:
  - { port: "53",    proto: tcp }
  - { port: "53",    proto: udp }
  - { port: "80",    proto: tcp }
  - { port: "443",   proto: tcp }
  - { port: "123",   proto: udp }
  - { port: "6443",  proto: tcp }   # RKE2 API Server
  - { port: "9345",  proto: tcp }   # RKE2 registration
  - { port: "2379",  proto: tcp }   # etcd client
  - { port: "2380",  proto: tcp }   # etcd peer
  - { port: "10250", proto: tcp }   # Kubelet
  - { port: "10257", proto: tcp }   # kube-controller-manager
  - { port: "10259", proto: tcp }   # kube-scheduler
  - { port: "4240",  proto: tcp }   # Cilium health check
  - { port: "8472",  proto: udp }   # Cilium VXLAN overlay

# ============================================================
# AppArmor — complain mode เพื่อไม่ block containerd
# ============================================================
ubtu24cis_apparmor_disable: false
ubtu24cis_apparmor_mode: complain

# ============================================================
# Auditd
# ============================================================
ubtu24cis_auditd_disk_full_action: syslog
ubtu24cis_auditd_disk_error_action: syslog
ubtu24cis_max_log_file_action: rotate

ubtu24cis_ipv6_required: true
